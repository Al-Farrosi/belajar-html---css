<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Background</title>
    <style>
      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #333;
      }

      h1 {
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        font-size: 40px;
        text-shadow: 2px 2px 5px black;
      }

      .frame {
        width: 400px;
        height: 400px;
        border: 10px solid white;
        margin: auto;
        background-image: url(img/kota.jpeg), url(img/juicy.jpeg);
        background-repeat: no-repeat, no-repeat;
        background-size: 320px, 400px;
        background-position: center bottom, center 70%;
        background-color: #f0f0f0;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
  </body>
</html>
