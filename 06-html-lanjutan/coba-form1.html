<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Element Form</title>
  </head>
  <body>
    <h1>Contoh Element-element Form pada HTML</h1>

    <form>
      <label for="nama">Nama</label>
      <input type="Text" id="nama" name="nama" placeholder="Masukkan Nama" />
      <br />
      <label for="password">Password</label>
      <input type="Password" id="password" name="password" placeholder="Masukkan Password" />
      <br />
      <label for="email">Email</label>
      <input type="Email" id="email" name="email" placeholder="Masukkan Email" />
      <br />
      <label for="angka">Angka</label>
      <input type="Number" id="angka" name="angka" placeholder="Masukkan Angka" />
      <br />
      <label for="tanggal">Tanggal</label>
      <input type="Date" id="tanggal" name="tanggal" />
      <br />
      <label for="warna">Pilih Warna</label>
      <input type="Color" id="warna" name="warna" />
      <br />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
