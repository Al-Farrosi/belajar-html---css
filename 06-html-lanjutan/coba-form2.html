<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Atribut</title>
</head>
<body>
    <h1>Contoh Atribut, Checkbox & Radio</h1>

    <form>
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan Nama" autocomplete="off" autofocus required/>
        <br/>

        <h3>HOBBY:</h3>
        <input type="checkbox" id="olahraga" name="hobby1" checked />
        <label for="olahraga">futsal</label>
        <br/>
        <input type="checkbox" id="baca" name="hobby2" />
        <label for="baca">membaca</label>
        <br/>

        <h3>Jenis Kelamin</h3>
        <input type="radio" id="laki" name="jenis_kelamin" value="laki-laki" checked />
        <label for="laki">Laki-laki</label>
        <br/>
        <input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan" />
        <label for="perempuan">Perempuan</label>
        <br/>
        <button type="submit">Kirim</button>
    </form>
</body>
</html>
